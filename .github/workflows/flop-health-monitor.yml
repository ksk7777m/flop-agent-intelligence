name: FLOP Health Monitor

on:
  schedule:
    # 09:00 and 21:00 JST (UTC+9)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flop-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public monitor
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: python -m pip install .

      - name: Run read-only monitor
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python3 -m flop_agent.cli health-monitor --public --no-save | tee /tmp/flop-monitor-summary.txt
          {
            echo '## FLOP READINESS'
            echo
            echo '```text'
            sed 's/[[:cntrl:]]//g' /tmp/flop-monitor-summary.txt
            echo '```'
            echo
            echo 'Scheduled monitor writes: 0'
          } >> "$GITHUB_STEP_SUMMARY"
